name: CD
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/catsdogs
  HELM_RELEASE: catsdogs
  K8S_NAMESPACE: default

jobs:
  check-ci:
    name: Gate on CI success
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: CI passed
        run: echo "CI run ${{ github.event.workflow_run.id }} succeeded — proceeding."

  deploy:
    name: Helm Deploy → local k8s
    runs-on: [self-hosted]
    needs: check-ci
    environment: production   

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          SHORT_SHA="${SHA::7}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Deploying sha-${SHORT_SHA}"

      - name: Log in to GHCR (Helm OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ${{ env.REGISTRY }} \
              --username ${{ github.actor }} \
              --password-stdin

      - name: Create/refresh GHCR image pull secret
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=${{ env.REGISTRY }} \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --namespace=${{ env.K8S_NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Helm upgrade --install
        run: |
          helm upgrade --install ${{ env.HELM_RELEASE }} \
            oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/catsdogs \
            --version 0.1.0 \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set image.tag=${{ steps.tag.outputs.image_tag }} \
            --wait \
            --timeout 3m \
            --atomic

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/${{ env.HELM_RELEASE }} \
            --namespace=${{ env.K8S_NAMESPACE }} \
            --timeout=2m

      - name: Smoke test
        run: |
          kubectl port-forward \
            svc/${{ env.HELM_RELEASE }}-svc 18000:8000 \
            --namespace=${{ env.K8S_NAMESPACE }} &
          PF_PID=$!
          sleep 4
          BASE_URL="http://localhost:18000" bash scripts/smoke_test.sh
          kill $PF_PID || true


  notify:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    steps:
      - name: Report
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "Deployed sha-${{ github.event.workflow_run.head_sha }} successfully."
          else
            echo "Deployment FAILED. Check the deploy job logs for details."
            exit 1
          fi
