name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/catsdogs

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v --tb=short

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test          
    permissions:
      contents: read
      packages: write    

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Always tag with the short git SHA  →  sha-abc1234
            type=sha,prefix=sha-
            # Tag as `latest` only on main branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # Tag with the branch name on non-main pushes (e.g. feature-xyz)
            type=ref,event=branch
            # Tag with pr-<number> on pull requests
            type=ref,event=pr

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Image digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "Pushed image digest ${{ steps.build-and-push.outputs.digest }}"

      # publish Helm chart to GHCR
      - name: Install Helm
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/setup-helm@v4
        with:
          version: "3.14.0"

      - name: Set chart appVersion to git SHA
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          # Patch appVersion in Chart.yaml so the deployed chart knows its app version
          sed -i "s/^appVersion:.*/appVersion: \"sha-${SHORT_SHA}\"/" helm/catsdogs/Chart.yaml
          echo "Chart appVersion set to sha-${SHORT_SHA}"

      - name: Package Helm chart
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          helm package helm/catsdogs --destination /tmp/helm-charts
          ls /tmp/helm-charts

      - name: Push Helm chart to GHCR (OCI)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # GHCR is already logged-in from the earlier docker/login-action step
          helm push /tmp/helm-charts/catsdogs-*.tgz oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts
