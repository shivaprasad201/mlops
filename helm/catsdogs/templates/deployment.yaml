apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "catsdogs.fullname" . }}
  labels:
    {{- include "catsdogs.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "catsdogs.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "catsdogs.selectorLabels" . | nindent 8 }}
      annotations:
        # Force pod restart on every Helm upgrade even if values haven't changed
        rollme: {{ randAlphaNum 5 | quote }}
        # Prometheus pod auto-discovery (picked up by the kubernetes-pods scrape job)
        prometheus.io/scrape: "true"
        prometheus.io/port:   "{{ .Values.service.port }}"
        prometheus.io/path:   "/metrics"
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: MODEL_PATH
              value: {{ .Values.env.modelPath | quote }}
            - name: DEVICE
              value: {{ .Values.env.device | quote }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
