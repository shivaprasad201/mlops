replicaCount: 1

image:
  repository: ghcr.io/YOUR_GITHUB_USER/catsdogs
  tag: latest
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-secret   

service:
  type: ClusterIP
  port: 8000

env:
  modelPath: models/model.pt
  device: cpu

resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "1Gi"
    cpu: "1000m"

readinessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 15
  periodSeconds: 30

# ── Prometheus ServiceMonitor ────────────────────────────────────────────────
# Only needed if you have the Prometheus operator installed.
# With plain prometheus-community/prometheus, leave this false — scraping is
# handled automatically via pod annotations (prometheus.io/scrape=true).
serviceMonitor:
  enabled: false
  prometheusRelease: prometheus
  interval: 30s
  scrapeTimeout: 10s
