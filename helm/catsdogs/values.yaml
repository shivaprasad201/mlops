replicaCount: 1

image:
  repository: ghcr.io/YOUR_GITHUB_USER/catsdogs
  # CI sets this to sha-<short> at deploy time; override for pinned deploys
  tag: latest
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-secret   # see README for how to create this secret

service:
  type: ClusterIP
  port: 8000

env:
  modelPath: models/model.pt
  device: cpu

resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "1Gi"
    cpu: "1000m"

readinessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 15
  periodSeconds: 30

# ── Prometheus ServiceMonitor ────────────────────────────────────────────────
# Requires the Prometheus operator (kube-prometheus-stack or prometheus-community/prometheus)
# to be installed in the cluster.
serviceMonitor:
  enabled: true
  # Must match the serviceMonitorSelector label on your Prometheus CR.
  # kube-prometheus-stack default: prometheus-kube-prometheus-prometheus
  # plain prometheus chart default: prometheus
  prometheusRelease: prometheus
  interval: 30s
  scrapeTimeout: 10s
